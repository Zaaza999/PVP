version: "3.9"

services:
  # -----------------------
  # 1. Duomenų bazė (MySQL)
  # -----------------------
  db:
    image: mysql:8.0
    container_name: komunalinis_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      komunalinis_db
      MYSQL_USER:          ${MYSQL_APP_USER}
      MYSQL_PASSWORD:      ${MYSQL_APP_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  # -----------------------
  # 2. API (.NET + Stripe)
  # -----------------------
  api:
    build:
      context: ./KomunalinisCentras.Backend
      dockerfile: Dockerfile
    container_name: komunalinis_api
    depends_on:
      - db
    restart: unless-stopped
    environment:
      # DB connection
      ConnectionStrings__DefaultConnection: >
        server=db;port=3306;database=komunalinis_db;
        uid=${MYSQL_APP_USER};pwd=${MYSQL_APP_PASSWORD}

      # Stripe credentials
      Stripe__SecretKey:      ${STRIPE_SECRET}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE}
      Stripe__WebhookSecret:  ${STRIPE_WEBHOOK}

      # Front-end URL for success/cancel pages
      App__FrontendUrl:       ${APP_FRONTEND}

      # ASP.NET settings
      ASPNETCORE_URLS:        http://+:8080
      DOTNET_ENVIRONMENT:     Production
    ports:
      - "5000:8080"

  # -----------------------
  # 3. NGROK tunelis (dev)
  # -----------------------
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    depends_on:
      - api
    command: http komunalinis_api:8080
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"   # ngrok Web UI

# ---------------------------------
# 4. Volume deklaracija (top-level)
# ---------------------------------
volumes:
  db_data:
